name = "LeanDownstreamPlayground"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanDownstreamPlayground"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "545b55ed85ce97981c9a4357e912d76b4837c49e"

[[lean_lib]]
name = "LeanDownstreamPlayground"
