name = "LeanDownstreamPlayground"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanDownstreamPlayground"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Pinned to the v4.30.0-rc1 release (commit 0c154d6). At rc1 the module
# `…SingularHomology.HomotopyInvarianceTopCat` is real content, so the build is
# clean; mathlib renamed it away (#37658) and later re-added it as a
# `deprecated_module` shim (#37877, live through v4.30.0 and master). Bumping
# across that window is what the module-deprecation demo exercises.
rev = "9204cf94730a9c1c12785216967b10c63f13d931"

[[lean_lib]]
name = "LeanDownstreamPlayground"
