name = "LeanDownstreamPlayground"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanDownstreamPlayground"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Pinned to the v4.30.0-rc2 release (commit 5450b53). The next release after it
# is v4.30.0, which is where mathlib deprecated `Matrix.star_mul` (2026-04-20);
# bumping across that release window is what the deprecation demo exercises.
rev = "c5ea00351c28e24afc9f0f84379aa41082b1188f"

[[lean_lib]]
name = "LeanDownstreamPlayground"
