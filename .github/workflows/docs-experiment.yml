# Experiment for leanprover-community/docgen-action PR #40.
# Each push to this branch is one run. The docgen-action revision below is the
# variable of the experiment. The lean-action cache is off, so that the
# repository cache holds the documentation caches only.
name: Docs cache experiment

on:
  push:
    branches: [docs-cache-experiments]

concurrency:
  group: docs-cache-experiment
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the project
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: "false"

      - name: Build the API documentation
        uses: marcelolynch/docgen-action@2cd53ef92aa33865fd90966b4f29c8559ad25e7e # PR #40 head
        with:
          deploy: "false"
          build-page: "false"

      - name: Check the pages of the project
        run: |
          echo "HTML files of the project:"
          find docs/docs -path 'docs/docs/LeanDownstreamPlayground*' -name '*.html' | sort
          echo "HTML files in total: $(find docs/docs -name '*.html' | wc -l)"
          echo "Top-level pages:"
          ls docs/docs/*.html | sort
          test -f docs/docs/LeanDownstreamPlayground.html
          test -f docs/docs/LeanDownstreamPlayground/Basic.html
          test -f docs/docs/LeanDownstreamPlayground/Extra.html
          echo "The pages of the project are present."

      - name: Report the cache entries of the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/caches?per_page=20" \
            --jq '.actions_caches[] | "\(.size_in_bytes/1e6|floor) MB  \(.key)"' || true
