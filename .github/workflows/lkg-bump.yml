# Keeps mathlib up to date and tracks compatibility.
#
# To watch the pre-flight gate fire, dispatch twice in a row: the first run
# bumps and opens the LKG PR; the second logs "Bump-PR branch already pins…"
# and "Remote 'hopscotch/lkg-bump' already at tree…", skipping the lake
# build and the force-push. The open-issue job opens an FKB fix PR
# independently when a regression is reported (both PRs coexist by design).

name: Update Mathlib Dependency
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Bump to latest mathlib
        id: bump
        uses: leanprover-community/downstream-reports/.github/actions/bump-to-latest@main
        with:
          # Run `hopscotch fix apply` after the bump so the PR carries the
          # source repair, not just the rev bump. With no-advisories left at its
          # default (false), this applies deprecation advisories — e.g. it
          # rewrites the deprecated `Matrix.star_mul` used in
          # LeanDownstreamPlayground/DeprecatedUsage.lean to `StarMul.star_mul`
          # once the bump crosses mathlib's 2026-04-20 deprecation.
          apply-fixes: 'true'

      - name: Open or update PR
        if: steps.bump.outputs.updated == 'true'
        uses: leanprover-community/downstream-reports/.github/actions/open-bump-pr@main
        with:
          title:          "chore: ${{ steps.bump.outputs.pr-title }}"
          message:        ${{ steps.bump.outputs.bump-description }}
          commit-message: ${{ steps.bump.outputs.commit-message }}
          # Surface hopscotch's own `fix apply` output in the PR body so the
          # applied deprecation fix is described in the tool's own words.
          fix-summary:    ${{ steps.bump.outputs.fix-summary }}

  open-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6.0.2

      - name: Open or update incompatibility issue (and fix PR)
        uses: leanprover-community/downstream-reports/.github/actions/track-incompatibility@main
        with:
          # Carry the boundary fix (and any deprecation advisories) into the
          # first-known-bad fix PR, matching the LKG bump above.
          apply-fixes: 'true'
